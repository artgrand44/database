apiVersion: v1
kind: ConfigMap
metadata:
  name: defaultcluster
data:
  db.properties: |
    org.art.db.cluster=defaultcluster
    org.art.db.shard=defaultclustershard1
    org.art.db.backupmax=maxbackup
    org.art.db.dbroot=/data/files
    org.art.db.logDelay=2
    org.art.db.documentCache=1M
    org.art.db.maxSegmentSize=100000
    org.art.db.nodeCache=10M
    org.art.db.indexCache=10M
    org.art.db.backupinterval=1w
    org.art.db.queueRecovery=3
