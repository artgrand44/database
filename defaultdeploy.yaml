apiVersion: apps/v1
kind: Deployment
metadata:
  name: defaultclusterservice
  labels: {
    "database" : "defaultcluster",
    "shard" : "defaultclustershard1"
  }
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/path: '/data/metrics'
    prometheus.io/port:   '8080'
spec:
  selector:
    matchLabels:
      app: defaultcluster
      database: defaultcluster
  replicas: 1
  template: # create pods using pod definition in this template
    metadata:
      labels:
        app: defaultcluster
        database: defaultcluster
    spec:
      containers:
      - name: defaultcluster
        image: db:v1 
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: defaultcluster
        volumeMounts:
            - name: defaultclusterdata
              mountPath: /data/files
            - name: defaultcluster
              mountPath: /discovery
            - name: config
              mountPath: "/config"
              readOnly: true
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /db/ping
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5        
      volumes:
        - name: defaultclusterdata
        - name: defaultcluster
        - name: config
          configMap:
            name: defaultcluster