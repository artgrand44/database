apiVersion: v1
kind: PersistentVolume
metadata:
  name: defaultclusterdata
spec:
  accessModes:
    - ReadWriteOncePod
  capacity:
    storage: 4Gi
  storageClassName: local-storage
  local:
    path: /art/defaultclusterdata/
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - thevalue
 
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: defaultclusterbackup
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 4Gi
  hostPath:
    path: /backup/defaultclusterbackup