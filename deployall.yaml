apiVersion: v1
kind: PersistentVolume
metadata:
  name: defaultclusterdata
spec:
  accessModes:
    - ReadWriteOncePod
  capacity:
    storage: 4Gi
  storageClassName: local-storage
  local:
    path: /art/defaultclusterdata/
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: db.cluster
          operator: In
          values:
          - defaultcluster
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: defaultclusterbackup
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 4Gi
  hostPath:
    path: /backup/defaultclusterbackup
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: defaultclusterbackup
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 4Gi
  hostPath:
    path: /backup/defaultclusterbackup
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: defaultcluster
data:
  db.properties: |
    org.art.db.cluster=defaultcluster
    org.art.db.shard=defaultclustershard1
    org.art.db.backupmax=maxbackup
    org.art.db.dbroot=/data/files
    org.art.db.logDelay=2
    org.art.db.documentCache=1M
    org.art.db.maxSegmentSize=100000
    org.art.db.nodeCache=10M
    org.art.db.indexCache=10M
    org.art.db.backupinterval=1w
    org.art.db.queueRecovery=3
    |
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: defaultcluster
  labels: {
    "database" : "defaultcluster",
    "shard" : "defaultclustershard1"
  }
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/path: '/data/metrics'
    prometheus.io/port:   '8080'
spec:
  selector:
    matchLabels:
      app: defaultcluster
      database: defaultcluster
  replicas: 1
  template: # create pods using pod definition in this template
    metadata:
      labels:
        app: defaultcluster
        database: defaultcluster
    spec:
      affinity:
         nodeAffinity:
           requiredDuringSchedulingIgnoredDuringExecution:
             nodeSelectorTerms:
             - matchExpressions:
               - key:  db.cluster
                 operator: In
                 values:
                 - defaultcluster          
      containers:
      - name: defaultcluster
        image: db:v1 
        livenessProbe:
          httpGet:
            path: /ping
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: defaultcluster
        volumeMounts:
            - name: defaultclusterdata
              mountPath: /data/files
            - name: defaultcluster
              mountPath: /discovery
            - name: config
              mountPath: "/config"
              readOnly: true
        ports:
        - containerPort: 8080              
      volumes:
        - name: defaultclusterdata
        - name: defaultcluster
        - name: config
          configMap:
            name: defaultcluster