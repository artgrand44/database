apiVersion: v1
kind: PersistentVolume
metadata:
  name: defaultdbdata
spec:
  accessModes:
    - ReadWriteOncePod
  capacity:
    storage: 4Gi
  storageClassName: local-storage
  local:
    path: /art/defaultdbdata/
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - thevalue
 
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: defaultdbbackup
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 4Gi
  hostPath:
    path: /backup/defaultdbbackup
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: defaultdb
data:
  db.properties: |
    org.art.db.database=defaultdb
    org.art.db.shard=defaultdbshard1
    org.art.db.backupmax=maxbackup
    org.art.db.dbroot=/data/files
    org.art.db.logDelay=2
    org.art.db.documentCache=1M
    org.art.db.maxSegmentSize=100000
    org.art.db.nodeCache=10M
    org.art.db.indexCache=10M
    org.art.db.backupinterval=1w
    org.art.db.queueRecovery=3
    |
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: defaultdbservice
  labels: {
    "database" : "defaultdb",
    "shard" : "defaultdbshard1"
  }
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/path: '/data/metrics'
    prometheus.io/port:   '8080'
spec:
  selector:
    matchLabels:
      app: defaultdb
      database: defaultdb
  replicas: 1
  template: # create pods using pod definition in this template
    metadata:
      labels:
        app: defaultdb
        database: defaultdb
    spec:
      containers:
      - name: defaultdb
        image: db:v1 
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: defaultdb
        volumeMounts:
            - name: defaultdbdata
              mountPath: /data/files
            - name: defaultdb
              mountPath: /discovery
            - name: config
              mountPath: "/config"
              readOnly: true
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /db/ping
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5        
      volumes:
        - name: defaultdbdata
        - name: defaultdb
        - name: config
          configMap:
            name: defaultdb