apiVersion: apps/v1
kind: Deployment
metadata:
  name: artdb
  labels: {
    "cluster" : "cluster",
  }
spec:
  selector:
    matchLabels:
      app: artdb
  replicas: 1 # tells deployment to run 1 pods matching the template
  template: # create pods using pod definition in this template
    metadata:
      labels:
        app: artdb
    spec:
      containers:
      - name: artdb
        image: db:v1 
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080