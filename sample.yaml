apiVersion: apps/v1
kind: Deployment
metadata:
  name: servicename
  labels: {
    "database" : "databasename",
    "shard" : "shardname"
  }
spec:
  selector:
    matchLabels:
      app: databasename
  replicas: reps
  template: # create pods using pod definition in this template
    metadata:
      labels:
        app: databasename
    spec:
      containers:
      - name: databasename
        image: db:v1 
        env:
           - name: database
             value: "databasename"
           - name: cloud
             value: kubernetes
           - name: org.art.db.backupinterval
             value: 1w
           - name: org.art.db.backuproot
             value: /backup
           - name: org.art.db.dbroot
             value: /data/files
        imagePullPolicy: IfNotPresent
        volumeMounts:
            - name: volumname
              mountPath: /data/files
        ports:
        - containerPort: 8080
      volumes:
        - name: volumname