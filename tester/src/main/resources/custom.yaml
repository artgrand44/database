apiVersion: apps/v1
kind: Deployment
metadata:
  name: secondary
  labels: {
    "database" : "cluster",
    "shard" : "shard1"
  }
spec:
  selector:
    matchLabels:
      app: db2
      database: cluster
      shard: shard1
  replicas: 1
  template: # create pods using pod definition in this template
    metadata:
      labels:
        app: db2
        database: cluster
        shard: shard1
    spec:
      containers:
      - name: db2
        image: db:v1 
        env:
           - name: database
             value: "cluster"
           - name: cloud
             value: kubernetes
           - name: org.art.db.backupinterval
             value: "1w"
           - name:  org.art.db.shard
             value : "shard1"
           - name: org.art.db.backuproot
             value: /backup
           - name: org.art.db.backupmax
             value: "2"
           - name: org.art.db.dbroot
             value: /data/files
        imagePullPolicy: IfNotPresent
        volumeMounts:
            - name: db2-shard1
              mountPath: /data/files
            - name: config
              mountPath: "/config"
              readOnly: true
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /db/ping
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 20
          periodSeconds: 20
          timeoutSeconds: 5
      volumes:
        - name: db2-shard1
        - name: config
          configMap:
            name: cluster
            items:
              - key: "db.properties"
                path: "db.properties"
        