apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: defaultcluster
  labels: {
    "database" : "defaultcluster",
    "shard" : "defaultclustershard1"
  }
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/path: '/data/metrics'
    prometheus.io/port:   '8080'
spec:
  selector:
    matchLabels:
      app: defaultcluster
      database: defaultcluster
  replicas: 1
  volumeClaimTemplates:             
  - metadata:
      name: defaultclusterdata
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 4Gi
  template: # create pods using pod definition in this template
    metadata:
      labels:
        app: defaultcluster
        database: defaultcluster
    spec:
      affinity:
         podAntiAffinity:
           requiredDuringSchedulingIgnoredDuringExecution:
           - labelSelector:
               matchExpressions:
               - key: app
                 operator: In
                 values:
                 - defaultcluster
             topologyKey: "kubernetes.io/hostname"
         nodeAffinity:
           requiredDuringSchedulingIgnoredDuringExecution:
             nodeSelectorTerms:
             - matchExpressions:
               - key:  db.cluster
                 operator: In
                 values:
                 - defaultcluster      
#              - key:  db.shard
#                operator: In
#                values:
#                - defaultclustershard1      
                     
      containers:
      - name: defaultcluster
        image: db:v1 
        livenessProbe:
          httpGet:
            path: /ping
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: defaultcluster
        volumeMounts:
            - name: defaultclusterdata
              mountPath: /data/files
            - name: defaultcluster
              mountPath: /discovery
            - name: config
              mountPath: "/config"
              readOnly: true
        ports:
        - containerPort: 8080              
      volumes:
        - name: defaultcluster
        - name: config
          configMap:
            name: defaultcluster