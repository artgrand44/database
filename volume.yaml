apiVersion: v1
kind: PersistentVolume
metadata:
  name: volumname
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: volumesize
  storageClassName: local-storage
  local:
    path: /art/volumname/
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: thelabel
          operator: In
          values:
          - thevalue