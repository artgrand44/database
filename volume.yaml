apiVersion: v1
kind: PersistentVolume
metadata:
  name: volumname
spec:
  accessModes:
    - ReadWriteOncePod
  capacity:
    storage: volumesize
  storageClassName: local-storage
  local:
    path: /art/volumname/
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: thelabel
          operator: In
          values:
          - thevalue
 
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: backupname
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: volumesize
  hostPath:
    path: /backup/backupname